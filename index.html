<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website dừng hoạt động ! </title>
    <style>
        /* Chống bôi đen chọn văn bản */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.5;
            color: #f1f5f9;
            letter-spacing: -0.3px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 50px;
            color: #fca5a5;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #ef4444;
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

    <div class="card">
        <div class="icon">⚠️</div>
        <h1>Website dừng hoạt động ! Cho đến khi có thông báo mới</h1>
        <div class="status-badge">
            <span class="dot"></span>
            <span>Trạng thái: Tạm khóa bảo trì</span>
        </div>
    </div>

    <script>
        // Chống Click chuột phải
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Chống phím tắt F12, Ctrl+U, Ctrl+Shift+I/J/C, Ctrl+S
        document.addEventListener('keydown', function(e) {
            if (
                e.keyCode === 123 || // F12
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || // Ctrl+Shift+I/J/C
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) // Ctrl+U, Ctrl+S
            ) {
                e.preventDefault();
                return false;
            }
        });

        // Xóa console log và liên tục xóa nếu cố mở DevTools
        setInterval(function() {
            console.clear();
        }, 1000);
    </script>
</body>
</html>
